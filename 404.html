<!DOCTYPE html>
<html lang="en-GB">
<head>

  <title>Page Not Found | Green's Brickwork &amp; Building</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--brick:#a8362c;--ink:#161616;--bg-soft:#f7f4ef}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-soft);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}

    p{font-size:1.1rem;opacity:.7;margin-bottom:32px;max-width:420px}
    .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    a.btn{display:inline-block;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:600;transition:opacity .2s}
    a.btn-primary{background:var(--brick);color:#fff}
    a.btn-secondary{background:transparent;color:var(--ink);border:1.5px solid rgba(0,0,0,.2)}
    a.btn:hover{opacity:.85}

</head>
<body>

</html>
